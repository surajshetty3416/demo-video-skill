<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --ink: #0f172a; --muted: #64748b; --field: #f1f5f9;
    --outline: #e2e8f0; --accent: #0f172a; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e293b; --ink: #f1f5f9; --muted: #94a3b8; --field: #0f172a;
      --outline: #334155; --accent: #f1f5f9; --accent-ink: #0f172a;
    }
  }
  body { width: 292px; margin: 0; padding: 18px; background: var(--bg); color: var(--ink);
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #dc2626; }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  label { display: block; margin: 12px 0 5px; font-size: 11px; font-weight: 500;
          color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 8px 10px;
         border: 1px solid var(--outline); border-radius: 8px; background: var(--field);
         font: inherit; color: inherit; }
  input[type=text]:focus { outline: none; border-color: var(--muted); }
  input[type=text]:disabled { opacity: 0.5; }
  button { width: 100%; margin-top: 18px; padding: 10px 0; border: none; border-radius: 8px;
           background: var(--accent); color: var(--accent-ink); font: inherit;
           font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.12); }
  button.rec { background: #dc2626; color: #fff; }
  button:disabled { opacity: 0.55; cursor: default; filter: none; }
  #status { margin-top: 12px; min-height: 16px; font-size: 12px; color: var(--muted);
            text-align: center; font-variant-numeric: tabular-nums; }
  #status.err { color: #dc2626; text-align: left; }
</style>
</head>
<body>
  <header><div class="dot"></div><h1>Demo Recorder</h1></header>
  <label for="server">Editor server</label>
  <input type="text" id="server" spellcheck="false" placeholder="http://127.0.0.1:8787">
  <label for="name">Take name</label>
  <input type="text" id="name" spellcheck="false" placeholder="recording">
  <button id="main">Start recording</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px; background: #fff; color: #1e293b;
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
  label { display: block; margin: 8px 0 3px; font-size: 11px; color: #64748b; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px;
         border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; color: inherit; }
  input[type=text]:focus { outline: none; border-color: #64748b; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 10px;
           font-size: 12px; color: #475569; }
  .check input { margin: 0; }
  .seg { display: flex; gap: 12px; font-size: 12px; color: #475569; }
  .seg label { display: flex; align-items: center; gap: 4px; margin: 0; font-size: 12px; }
  .seg input { margin: 0; }
  button { width: 100%; margin-top: 12px; padding: 8px 0; border: none; border-radius: 6px;
           background: #0f172a; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #1e293b; }
  button.rec { background: #dc2626; }
  button.rec:hover { background: #b91c1c; }
  button:disabled { background: #94a3b8; cursor: default; }
  #status { margin-top: 10px; min-height: 16px; font-size: 12px; color: #64748b; }
  #status.err { color: #b91c1c; }
  #status a { color: #4f46e5; }
</style>
</head>
<body>
  <h1>Demo Recorder</h1>
  <label for="server">Editor server</label>
  <input type="text" id="server" spellcheck="false" placeholder="http://127.0.0.1:8787">
  <label for="name">Take name</label>
  <input type="text" id="name" spellcheck="false" placeholder="recording">
  <label>Cursor</label>
  <div class="seg">
    <label><input type="radio" name="mode" value="frames" checked> Drawn (editable)</label>
    <label><input type="radio" name="mode" value="baked"> As recorded</label>
  </div>
  <div class="check">
    <input type="checkbox" id="open" checked>
    <label for="open" style="margin:0">Open editor when done</label>
  </div>
  <button id="main">Start recording</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>

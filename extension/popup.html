<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* frappe-ui espresso tokens (light + dark) */
  :root {
    --surface: #ffffff; --surface-field: #f3f3f3; --surface-hover: #ededed;
    --ink: #171717; --ink-8: #383838; --ink-5: #737373;
    --outline: #e2e2e2;
    --btn: #171717; --btn-hover: #383838; --btn-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #191919; --surface-field: #262626; --surface-hover: #2e2e2e;
      --ink: #f8f8f8; --ink-8: #d4d4d4; --ink-5: #a1a1a1;
      --outline: #333333;
      --btn: #f8f8f8; --btn-hover: #d4d4d4; --btn-ink: #171717;
    }
  }
  body {
    width: 208px; margin: 0; padding: 12px; background: var(--surface); color: var(--ink);
    font: 13px/1.4 "InterVariable", "Inter", -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }
  h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .row { display: flex; gap: 8px; }
  button {
    flex: 1; height: 28px; border: none; border-radius: 8px;
    background: var(--btn); color: var(--btn-ink); font: inherit; font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button.sub {
    background: var(--surface-field); color: var(--ink-8);
    border: 1px solid var(--outline);
  }
  button.sub:hover { background: var(--surface-hover); }
  button:disabled { opacity: 0.55; cursor: default; }
  #status { margin-top: 8px; font-size: 12px; color: var(--ink-5); text-align: center;
            font-variant-numeric: tabular-nums; }
  #status:empty { display: none; }
  #status.err { color: var(--ink-8); }
</style>
</head>
<body>
  <h1>Demo Recorder</h1>
  <div class="row">
    <button id="pause" class="sub" hidden>Pause</button>
    <button id="main">Record</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Feedback</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    background: #f1f5f9; color: #0f172a;
    display: flex; align-items: center; justify-content: center; gap: 28px;
  }
  .card {
    width: 620px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
    padding: 40px; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.05);
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: #64748b; font-size: 15px; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .chip {
    padding: 10px 18px; border-radius: 999px; border: 1px solid #cbd5e1;
    background: #fff; font-size: 14.5px; font-weight: 500; cursor: pointer;
    transition: all .18s ease;
  }
  .chip:hover { border-color: #94a3b8; }
  .chip.on { background: #0f172a; border-color: #0f172a; color: #fff; }
  textarea {
    width: 100%; margin-top: 20px; height: 116px; resize: none;
    border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 14px 16px;
    font: inherit; font-size: 15px; color: #0f172a; outline: none;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.13); }
  textarea::placeholder { color: #94a3b8; }
  button {
    width: 100%; margin-top: 20px; height: 50px; border: 0; border-radius: 12px;
    background: #0f172a; color: #fff; font: inherit; font-size: 15.5px; font-weight: 600;
    cursor: pointer; transition: background .18s ease; position: relative;
  }
  button:hover { background: #1e293b; }
  .hint { margin-top: 12px; text-align: center; color: #94a3b8; font-size: 13px; }
  kbd {
    font: inherit; font-size: 12px; color: #475569; background: #f8fafc;
    border: 1px solid #e2e8f0; border-bottom-width: 2px; border-radius: 6px;
    padding: 2px 6px; margin: 0 2px;
  }
  .stats { display: flex; flex-direction: column; gap: 14px; width: 250px; }
  .stat {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px 22px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
  }
  .stat b { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; display: block; transition: transform .3s ease; }
  .stat b.pop { transform: scale(1.12); color: #6366f1; }
  .stat span { color: #64748b; font-size: 13.5px; }
  .spinner {
    display: none; width: 20px; height: 20px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,.3); border-top-color: #fff;
    animation: spin .7s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success { display: none; text-align: center; padding: 34px 0 22px; }
  .success svg { width: 76px; height: 76px; }
  .success circle {
    fill: none; stroke: #10b981; stroke-width: 5;
    stroke-dasharray: 214; stroke-dashoffset: 214;
  }
  .success path {
    fill: none; stroke: #10b981; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 48; stroke-dashoffset: 48;
  }
  .success.go circle { animation: draw .55s ease-out forwards; }
  .success.go path { animation: draw .4s ease-out .4s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .success h2 { font-size: 22px; margin-top: 18px; letter-spacing: -0.02em; }
  .success p { color: #64748b; font-size: 15px; margin-top: 6px; }
</style>
</head>
<body>
  <div class="card">
    <div id="form">
      <h1>How did you hear about us?</h1>
      <div class="sub">Help us understand what's working.</div>
      <div class="chips">
        <div class="chip" id="chip-friend">Friend / colleague</div>
        <div class="chip" id="chip-search">Search</div>
        <div class="chip" id="chip-social">Social media</div>
        <div class="chip" id="chip-other">Other</div>
      </div>
      <textarea id="note" placeholder="Anything else? (optional)"></textarea>
      <button id="send"><span id="send-label">Send feedback</span><span class="spinner" id="spin"></span></button>
      <div class="hint">Press <kbd>⌘</kbd><kbd>Enter</kbd> to send</div>
    </div>
    <div class="success" id="success">
      <svg viewBox="0 0 76 76">
        <circle cx="38" cy="38" r="34"/>
        <path d="M24 39 L34 49 L53 29"/>
      </svg>
      <h2>Thanks for the feedback!</h2>
      <p>It goes straight to the team.</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="count">1,284</b><span>responses this week</span></div>
    <div class="stat"><b>62%</b><span>from word of mouth</span></div>
    <div class="stat"><b>4.8 / 5</b><span>average rating</span></div>
  </div>
<script>
  document.querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => c.classList.toggle('on')));
  function submit() {
    document.getElementById('send-label').style.display = 'none';
    document.getElementById('spin').style.display = 'block';
    setTimeout(() => {
      document.getElementById('form').style.display = 'none';
      const s = document.getElementById('success');
      s.style.display = 'block'; s.classList.add('go');
      const c = document.getElementById('count');
      c.textContent = '1,285'; c.classList.add('pop');
      setTimeout(() => c.classList.remove('pop'), 450);
    }, 650);
  }
  document.getElementById('send').addEventListener('click', submit);
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submit();
  });
</script>
</body>
</html>
